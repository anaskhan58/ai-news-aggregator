name: Daily AI news digest

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 07:00 IST every day (GitHub may start it a few minutes late)
  workflow_dispatch: # "Run workflow" button in the Actions tab
    inputs:
      hours:
        description: "Lookback window in hours"
        default: "24"
      dry_run:
        description: "Dry run (build the email but don't send it)"
        type: boolean
        default: false

concurrency:
  group: daily-digest # never run two digests at once
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      # Secrets: Settings -> Secrets and variables -> Actions -> Secrets
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MY_EMAIL: ${{ secrets.MY_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      WEBSHARE_USERNAME: ${{ secrets.WEBSHARE_USERNAME }}
      WEBSHARE_PASSWORD: ${{ secrets.WEBSHARE_PASSWORD }}
      # Non-secret settings: Settings -> Secrets and variables -> Actions -> Variables (optional)
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      TOP_N: ${{ vars.TOP_N || '10' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Check database connection
        run: uv run --no-sync main.py --check

      - name: Run pipeline
        run: |
          ARGS="--hours ${{ inputs.hours || '24' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          uv run --no-sync main.py $ARGS

      - name: Upload email preview (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-email
          path: output/*.html
